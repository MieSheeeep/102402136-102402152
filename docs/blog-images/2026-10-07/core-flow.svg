<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#678577"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="500" y="52" font-family="FangSong, 仿宋, STFangsong, serif" font-size="36" fill="#293c34" text-anchor="middle">发布与找回流程</text><rect x="260" y="88" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="138" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">发布者填写寻物／招领信息</text><path d="M500,172 L500,220" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><path d="M500,220 L740,266 L500,312 L260,266 Z" fill="#f7ece1" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="276" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">信息是否有效？</text><path d="M740,266 L790,266" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="248" font-family="FangSong, 仿宋, STFangsong, serif" font-size="20" fill="#293c34" text-anchor="middle">否</text><rect x="790" y="220" width="180" height="92" rx="8" fill="#f7ece1" stroke="#a9b9ad" stroke-width="2"/><text x="880" y="256" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">校验未通过</text><text x="880" y="292" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">提示后修改</text><path d="M880,220 L880,130 L740,130" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><path d="M500,312 L500,360" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="344" font-family="FangSong, 仿宋, STFangsong, serif" font-size="20" fill="#293c34" text-anchor="middle">是</text><rect x="260" y="360" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="410" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">保存为“进行中”</text><path d="M500,444 L500,492" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="492" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="542" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">其他同学浏览／搜索／筛选</text><path d="M500,576 L500,624" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="624" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="674" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">打开详情，按联系方式在应用外沟通</text><path d="M500,708 L500,756" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="756" width="480" height="92" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="792" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">确认找回／归还后</text><text x="500" y="828" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">发布者在“我的发布”确认完成</text><path d="M500,848 L500,896" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="896" width="480" height="92" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="932" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">保存为“已找到”／“已归还”</text><text x="500" y="968" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">重新加载列表或详情可见新状态</text><path d="M260,942 L80,942 L80,402 L260,402" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="165" y="715" font-family="FangSong, 仿宋, STFangsong, serif" font-size="24"