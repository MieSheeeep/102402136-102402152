<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#678577"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="500" y="52" font-family="FangSong, 仿宋, STFangsong, serif" font-size="36" fill="#293c34" text-anchor="middle">发布代码调用</text><rect x="260" y="88" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="138" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">app.js 读取表单 → draft</text><path d="M500,172 L500,220" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><path d="M500,220 L740,266 L500,312 L260,266 Z" fill="#f7ece1" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="276" font-family="FangSong, 仿宋, STFangsong, serif" font-size="24" fill="#293c34" text-anchor="middle">validateItem() 通过？</text><path d="M740,266 L790,266" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="248" font-family="FangSong, 仿宋, STFangsong, serif" font-size="20" fill="#293c34" text-anchor="middle">否</text><rect x="790" y="220" width="180" height="92" rx="8" fill="#f7ece1" stroke="#a9b9ad" stroke-width="2"/><text x="880" y="256" font-family="FangSong, 仿宋, STFangsong, serif" font-size="24.666666666666668" fill="#293c34" text-anchor="middle">显示字段错误</text><text x="880" y="292" font-family="FangSong, 仿宋, STFangsong, serif" font-size="24.666666666666668" fill="#293c34" text-anchor="middle">保留输入</text><path d="M880,220 L880,130 L740,130" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><path d="M500,312 L500,360" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="344" font-family="FangSong, 仿宋, STFangsong, serif" font-size="20" fill="#293c34" text-anchor="middle">是</text><rect x="260" y="360" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="392" font-family="FangSong, 仿宋, STFangsong, serif" font-size="22.399999999999995" fill="#293c34" text-anchor="middle">有图片先调用 API.upload()</text><text x="500" y="428" font-family="FangSong, 仿宋, STFangsong, serif" font-size="22.399999999999995" fill="#293c34" text-anchor="middle">API.request() 提交 POST /api/items</text><path d="M500,444 L500,492" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="492" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="524" font-family="FangSong, 仿宋, STFangsong, serif" font-size="22.17821782178218" fill="#293c34" text-anchor="middle">server/app.cjs 接收请求</text><text x="500" y="560" font-family="FangSong, 仿宋, STFangsong, serif" font-size="22.17821782178218" fill="#293c34" text-anchor="middle">auth() 识别用户，validateItem() 校验</text><path d="M740,534 L790,534" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="790" y="492" width="180" height="84" rx="8" fill="#f7ece1" stroke="#a9b9ad" stroke-width="2"/><text x="880" y="524" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">请求出错</text><text x="880" y="560" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">catch 提示</text><path d="M880,492 L880,430 L980,430 L980,130 L740,130" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><path d="M500,576 L500,624" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="624" width="480" height="84" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="656" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">createItem() 生成记录</text><text x="500" y="692" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">ownedImage() 检查图片归属</text><path d="M500,708 L500,756" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="756" width="480" height="92" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="792" font-family="FangSong, 仿宋, STFangsong, serif" font-size="25.454545454545457" fill="#293c34" text-anchor="middle">db.prepare().run() 执行 INSERT</text><text x="500" y="828" font-family="FangSong, 仿宋, STFangsong, serif" font-size="25.454545454545457" fill="#293c34" text-anchor="middle">返回保存后的记录</text><path d="M500,848 L500,896" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="896" width="480" height="92" rx="8" fill="#f1f5ef" stroke="#a9b9ad" stroke-width="2"/><text x="500" y="932" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">refreshRemote() 获取新 state</text><text x="500" y="968" font-family="FangSong, 仿宋, STFangsong, serif" font-size="26" fill="#293c34" text-anchor="middle">views.js 生成页面内容</text></svg>