<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#678577"/></marker></defs><rect width="100%" height="100%" fill="#fafbf8"/><text x="500" y="52" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#293c34" text-anchor="middle">校园失物招领 · 核心流程</text><rect x="260" y="88" width="480" height="84" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="500" y="137" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">发布者填写寻物／招领信息</text><path d="M500,172 L500,220" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="220" width="480" height="92" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="500" y="273" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">检查名称、地点、时间、联系方式</text><path d="M740,266 L790,266" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="790" y="220" width="180" height="92" rx="16" fill="#f7ece1" stroke="#c9d7ce"/><text x="880" y="257" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">信息不完整</text><text x="880" y="289" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">提示后修改</text><path d="M880,220 L880,130 L740,130" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><path d="M500,312 L500,360" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="360" width="480" height="84" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="500" y="409" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">保存信息，初始为“进行中”</text><path d="M500,444 L500,492" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="492" width="480" height="84" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="500" y="541" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">其他同学浏览／搜索／筛选</text><path d="M500,576 L500,624" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="624" width="480" height="84" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="500" y="673" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">打开详情，按联系方式在应用外沟通</text><path d="M500,708 L500,756" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="756" width="480" height="92" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="500" y="793" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">确认找回／归还后</text><text x="500" y="825" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">发布者在“我的发布”确认完成</text><path d="M500,848 L500,896" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="896" width="480" height="92" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="500" y="933" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">保存为“已找到”／“已归还”</text><text x="500" y="965" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">重新加载列表或详情可见新状态</text><path d="M260,942 L80,942 L80,402 L260,402" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="715" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#293c34" text-anchor="middle">误操作时</text><text x="145" y="746" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#293c34" text-anchor="middle">本人确认取消完成</text></svg>