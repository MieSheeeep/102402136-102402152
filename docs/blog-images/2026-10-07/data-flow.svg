<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="780" viewBox="0 0 1060 780"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#678577"/></marker></defs><rect width="100%" height="100%" fill="#fafbf8"/><text x="530" y="52" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#293c34" text-anchor="middle">两种运行方式 · 数据分别保存</text><text x="530" y="108" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#293c34" text-anchor="middle">Chrome直接打开 index.html</text><rect x="40" y="143" width="270" height="110" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="175" y="189" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">网页界面</text><text x="175" y="221" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">views.js／app.js</text><path d="M310,198 L390,198" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="143" width="270" height="110" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="525" y="189" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">业务规则 data.js</text><text x="525" y="221" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">校验／筛选／状态</text><path d="M660,198 L740,198" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="143" width="280" height="110" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="880" y="189" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">localStorage</text><text x="880" y="221" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">当前浏览器信息与收藏</text><text x="530" y="292" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#293c34" text-anchor="middle">seed.js提供初始数据；固定本地用户，无账号登录</text><line x1="40" y1="330" x2="1020" y2="330" stroke="#d5dfd6"/><text x="530" y="386" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#293c34" text-anchor="middle">npm start 启动完整本地应用</text><rect x="40" y="430" width="270" height="110" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="175" y="476" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">网页界面</text><text x="175" y="508" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">api.js 发出HTTP请求</text><path d="M310,485 L390,485" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="430" width="270" height="110" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="525" y="476" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">Fastify后端接口</text><text x="525" y="508" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">登录／权限／业务校验</text><path d="M660,466 L740,466" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="420" width="280" height="100" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="880" y="461" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">SQLite数据库</text><text x="880" y="493" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">用户／发布／收藏／会话</text><path d="M660,505 L700,505 L700,610 L740,610" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="560" width="280" height="100" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="880" y="601" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">本地图片文件</text><text x="880" y="633" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">校验后转为WebP保存</text><path d="M525,540 L525,610 L175,610 L175,540" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="650" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#293c34" text-anchor="middle">接口返回记录，页面更新展示</text><text x="530" y="730" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#293c34" text-anchor="middle">两种数据不自动互通；演示内容仅在需要初始化时写入</text></svg>