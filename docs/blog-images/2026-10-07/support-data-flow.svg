842" y="778" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#293c34" text-anchor="middle">申请、公告及状态</text><line x1="28" y1="827" x2="1189" y2="827" stroke="#d5dfd6"/><text x="610" y="865" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#293c34" text-anchor="middle">图片上传返回地址后，发布或头像请求再引用；两个请求目前不属于同一事务。</text><text x="610" y="902" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#293c34" text-anchor="middle">批准公告时，写入公告与移除申请在同一事务中完成；展示还检查到期时间和物品状态。</text><text x="610" y="938" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#293c34" text-anchor="middle">D3、D4、D5按用途合并相关表或文件；具体表名及关联关系见正文。</text></svg>