oke-width="3" marker-end="url(#arrow)"/><text x="842" y="167" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#293c34" text-anchor="middle">账号及会话记录</text><path d="M954,228 L730,228" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="842" y="253" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#293c34" text-anchor="middle">用户、有效会话</text><rect x="28" y="320" width="180" height="110" fill="#f8eee3" stroke="#c9d7ce"/><text x="118" y="366" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">本人或</text><text x="118" y="398" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">查看主页的同学</text><rect x="432" y="320" width="298" height="110" rx="16" fill="#edf3ee" stroke="#c9d7ce"/><text x="581" y="366" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">P6 资料与公开主页</text><text x="581" y="398" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#293c34" text-anchor="middle">归属校验、统计发布</text><path d="M1189,320 H954 V430 H1189" fill="#f0f3f7" stroke="#9facbb" stroke-width="2"/><text x="1071" y="366" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#293c34" text-anchor="middle">D3 用户表</text><text x="1071" y="398" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#293c34" text-anchor="middle">D1 物品表</text><path d="M208,354 L432,354" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="342" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#293c34" text-anchor="middle">资料或用户编号</text><path d="M432,403 L208,403" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="428" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#293c34" text-anchor="middle">本人资料／公开主页</text><path d="M730,354 L954,354" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="842" 