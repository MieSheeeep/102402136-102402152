53" fill="none" stroke="#678577" stroke-width="3" marker-end="url(#arrow)"/><text x="842" y="780" font-family="FangSong, 仿宋, STFangsong, serif" font-size="22" fill="#293c34" text-anchor="middle">关系保存结果</text><line x1="28" y1="827" x2="1189" y2="827" stroke="#d5dfd6"/><text x="610" y="865" font-family="FangSong, 仿宋, STFangsong, serif" font-size="24" fill="#293c34" text-anchor="middle">/api/state 读取物品集合，data.js 计算搜索和筛选结果。</text><text x="610" y="910" font-family="FangSong, 仿宋, STFangsong, serif" font-size="24" fill="#293c34" text-anchor="middle">D1为同一张物品表；收藏仅存编号，展示时读取物品内容。</text></svg>